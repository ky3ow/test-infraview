name: Terraform
on:
  workflow_call:
    inputs:
      dir:
        required: true
        type: string
      apply:
        required: false
        type: boolean
        default: false
      destroy:
        required: false
        type: boolean
        default: false
      revision-info:
        required: false
        type: boolean
        default: false
    secrets:
      role-to-assume:
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.dir }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
          -backend-config="bucket=${{ vars.S3_BUCKET }}" \
          -backend-config="key=${{ inputs.dir }}/terraform.tfstate"

      - name: Terraform Plan
        run: |
          terraform plan -out plan.out
          terraform show plan.out -no-color

      - name: Prepare plan JSON and InfraView credentials
        if: inputs.revision-info && !inputs.destroy
        run: |
          terraform show -json plan.out > plan.json

          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id infraview/secrets \
            --query SecretString --output text)

          INFRAVIEW_URL=$(echo "$SECRET" | jq -r '.url')
          INFRAVIEW_WRITE_TOKEN=$(echo "$SECRET" | jq -r '.write_token')

          echo "::add-mask::$INFRAVIEW_WRITE_TOKEN"

          echo "INFRAVIEW_URL=$INFRAVIEW_URL" >> "$GITHUB_ENV"
          echo "INFRAVIEW_WRITE_TOKEN=$INFRAVIEW_WRITE_TOKEN" >> "$GITHUB_ENV"

      - name: Report Revision to InfraView
        if: inputs.revision-info && !inputs.destroy
        uses: ./.github/actions/vendored-revision-info
        with:
          base_url: ${{ env.INFRAVIEW_URL }}
          token: ${{ env.INFRAVIEW_WRITE_TOKEN }}
          namespace: ${{ inputs.dir }}
          plan_file: ${{ inputs.dir }}/plan.json

      - name: Terraform Apply
        if: inputs.apply && !inputs.destroy
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: inputs.destroy
        run: terraform destroy -auto-approve
