name: Terraform
on:
  workflow_call:
    inputs:
      dir:
        required: true
        type: string
      apply:
        required: false
        type: boolean
        default: false
    secrets:
      role-to-assume:
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.dir }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init \
          -backend-config="bucket=${{ vars.S3_BUCKET }}" \
          -backend-config="key=${{ inputs.dir }}/terraform.tfstate"

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        if: inputs.apply
        run: terraform apply -auto-approve
