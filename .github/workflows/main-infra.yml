name: Main - Infra
on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      dir: infra
      apply: true
    secrets:
      role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
