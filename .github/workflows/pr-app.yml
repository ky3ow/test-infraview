name: PR - App
on:
  pull_request:
    paths:
      - 'app/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      dir: app
      apply: false
      revision-info: true
    secrets:
      role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
